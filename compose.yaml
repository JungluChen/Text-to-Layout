name: textlayout

services:
  api:
    image: textlayout:full
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WITH_SOLVERS: "1"
    container_name: textlayout-api
    ports:
      - "8000:8000"
    environment:
      - MPLBACKEND=Agg
      - QISKIT_METAL_HEADLESS=1
    volumes:
      - .:/workspace
      - ./out:/workspace/out
    command: ["textlayout", "serve", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  doctor:
    image: textlayout:full
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WITH_SOLVERS: "1"
    container_name: textlayout-doctor
    command: ["textlayout", "doctor"]
    profiles: ["tools", "audit"]

  cli:
    image: textlayout:full
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WITH_SOLVERS: "1"
    container_name: textlayout-cli
    stdin_open: true
    tty: true
    volumes:
      - .:/workspace
      - ./out:/workspace/out
    command: ["/bin/bash"]
    profiles: ["cli"]

  core:
    image: textlayout/core:local
    build:
      context: .
      dockerfile: docker/core.Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-DEVELOPMENT_UNSET}
    profiles: ["core"]
    volumes:
      - textlayout-artifacts:/workspace/out

  palace:
    image: textlayout/palace:local
    build:
      context: .
      dockerfile: docker/palace.Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-DEVELOPMENT_UNSET}
    profiles: ["palace", "signoff"]
    volumes:
      - palace-output:/solver-output

  openems:
    image: textlayout/openems:local
    build:
      context: .
      dockerfile: docker/openems.Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-DEVELOPMENT_UNSET}
    profiles: ["fdtd", "signoff"]
    volumes:
      - openems-output:/solver-output

  klayout:
    image: textlayout/klayout:local
    build:
      context: .
      dockerfile: docker/klayout.Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-DEVELOPMENT_UNSET}
    profiles: ["signoff", "visualization"]
    volumes:
      - klayout-output:/solver-output

  josephson:
    image: textlayout/josephson:local
    build:
      context: .
      dockerfile: docker/josephson.Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-DEVELOPMENT_UNSET}
    profiles: ["jpa"]
    volumes:
      - josephson-output:/solver-output

  josim:
    image: textlayout/josim:local
    build:
      context: .
      dockerfile: docker/josim.Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-DEVELOPMENT_UNSET}
    profiles: ["transient"]
    volumes:
      - josim-output:/solver-output

  paraview:
    image: textlayout/paraview:local
    build:
      context: .
      dockerfile: docker/paraview.Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-DEVELOPMENT_UNSET}
    profiles: ["visualization"]
    volumes:
      - paraview-output:/solver-output

volumes:
  textlayout-artifacts:
  palace-output:
  openems-output:
  klayout-output:
  josephson-output:
  josim-output:
  paraview-output:
