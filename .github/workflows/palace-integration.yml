name: palace-integration

# Solver-enabled CI. Deliberately separate from normal PR CI, which only
# tests the absent-solver path. Pinned to Palace 0.17.0 and the committed
# Spack environment (external_tools/palace/spack.yaml). Requires
# SMOKE_TEST_PASSED before the reduced CPW benchmark runs. Never commits
# binaries or ParaView field data; artifacts are compact JSON/CSV/logs only.

on:
  workflow_dispatch:
    inputs:
      run_benchmark:
        description: "Also run the reduced CPW quarter-wave benchmark"
        type: boolean
        default: true
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC

concurrency:
  group: palace-integration
  cancel-in-progress: false

jobs:
  palace:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install toolchain prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gfortran git openmpi-bin libopenmpi-dev \
            libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Sync Python environment (pinned Gmsh 4.15.2)
        run: uv sync --all-extras

      - name: Restore Spack and Palace caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/textlayout-palace
            .tools/palace
            .tools/external/sources
          key: palace-0.17.0-${{ hashFiles('external_tools/palace/spack.yaml', 'scripts/external/_palace_common.py', 'scripts/external/install_palace.py') }}

      - name: Install pinned Palace 0.17.0 via Spack
        run: uv run python scripts/external/install_palace.py

      - name: Verify installation state
        run: uv run python scripts/external/check_palace.py

      - name: Run the official Palace smoke benchmark
        run: uv run python scripts/external/run_palace_smoke.py

      - name: Require SMOKE_TEST_PASSED
        run: |
          uv run python scripts/external/check_palace.py
          uv run python - <<'EOF'
          import json, pathlib, sys
          state = json.loads(pathlib.Path("out/toolchain/palace_check.json").read_text())["state"]
          print(f"palace check state: {state}")
          sys.exit(0 if state in {"SMOKE_TEST_PASSED", "BENCHMARK_EXECUTED"} else 1)
          EOF

      # A runner shutdown can skip even always() cleanup. Upload the small
      # installation/smoke packet before starting the expensive benchmark.
      - name: Record pre-benchmark runner resources
        run: |
          mkdir -p out/toolchain
          {
            date -u +%FT%TZ
            uname -a
            free -m
            df -h .
            ulimit -a
          } > out/toolchain/runner_resources.txt
          cat out/toolchain/runner_resources.txt

      - name: Preserve installation and smoke evidence before benchmark
        uses: actions/upload-artifact@v4
        with:
          name: palace-pre-benchmark-${{ github.run_attempt }}
          path: |
            .tools/palace/install.json
            out/toolchain/*.json
            out/toolchain/*.txt
            out/toolchain/*.log
            out/toolchain/palace_smoke/*.json
            out/toolchain/palace_smoke/*.txt
            out/toolchain/palace_smoke/postpro/eigenmode/*.csv
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Prepare the reduced CPW base mesh checkpoint
        if: ${{ github.event_name == 'schedule' || inputs.run_benchmark }}
        run: |
          uv run textlayout simulate palace-resonator \
            --out out/palace_resonator_v017 \
            --processes 2 \
            --mesh-scale 4.0 \
            --amr-iterations 4 \
            --stage base_mesh
          uv run python - <<'EOF'
          import hashlib, json, pathlib
          root = pathlib.Path("out/palace_resonator_v017")
          record = json.loads((root / "stages/base_mesh.json").read_text())
          assert record["stage"] == "base_mesh" and record["status"] == "complete"
          for relative, expected in record["output_hashes"].items():
              actual = hashlib.sha256((root / relative).read_bytes()).hexdigest()
              assert actual == expected, relative
          print("BASE_MESH_CHECKPOINT_VERIFIED")
          EOF

      - name: Preserve the verified base mesh before the long solve
        if: ${{ github.event_name == 'schedule' || inputs.run_benchmark }}
        uses: actions/upload-artifact@v4
        with:
          name: palace-base-mesh-${{ github.run_attempt }}
          path: |
            out/palace_resonator_v017/toolchain.json
            out/palace_resonator_v017/environment.json
            out/palace_resonator_v017/resource_decision.json
            out/palace_resonator_v017/fem_model.json
            out/palace_resonator_v017/base_mesh/mesh_metrics.json
            out/palace_resonator_v017/base_mesh/*.msh
            out/palace_resonator_v017/stages/*.json
          if-no-files-found: error
          retention-days: 7

      # This separate coarse profile measures actual Palace execution within
      # hard resource bounds. It is diagnostic evidence, not the release result.
      - name: Run bounded Palace solver diagnostic
        if: ${{ github.event_name == 'schedule' || inputs.run_benchmark }}
        run: |
          .venv/bin/python -u scripts/observe_palace_ci.py \
            --run out/palace_bounded_diagnostic \
            --output out/toolchain/palace_bounded_runtime.txt &
          observer_pid=$!
          trap 'kill "$observer_pid" 2>/dev/null || true; wait "$observer_pid" 2>/dev/null || true' EXIT
          uv run textlayout simulate palace-resonator \
            --out out/palace_bounded_diagnostic \
            --bounded-validation-profile \
            --amr-update-fraction 0.1 \
            --max-rss-gib 8 \
            --max-runtime-seconds 1200

      - name: Preserve bounded diagnostic outputs before the full benchmark
        if: ${{ always() && (github.event_name == 'schedule' || inputs.run_benchmark) }}
        uses: actions/upload-artifact@v4
        with:
          name: palace-bounded-diagnostic-${{ github.run_attempt }}
          path: |
            out/toolchain/palace_bounded_runtime.txt
            out/palace_bounded_diagnostic/*.json
            out/palace_bounded_diagnostic/*.md
            out/palace_bounded_diagnostic/**/*.json
            out/palace_bounded_diagnostic/**/*.csv
            out/palace_bounded_diagnostic/**/*.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Run the reduced CPW quarter-wave benchmark
        if: ${{ github.event_name == 'schedule' || inputs.run_benchmark }}
        run: |
          # Observe without owning or changing the solver command. On shell exit,
          # stop only this observer; retain the benchmark's original exit status.
          .venv/bin/python -u scripts/observe_palace_ci.py \
            --run out/palace_resonator_v017 \
            --output out/toolchain/palace_runtime.txt &
          observer_pid=$!
          trap 'kill "$observer_pid" 2>/dev/null || true; wait "$observer_pid" 2>/dev/null || true' EXIT
          uv run textlayout simulate palace-resonator \
            --out out/palace_resonator_v017 \
            --resume \
            --processes 2 \
            --mesh-scale 4.0 \
            --amr-iterations 4

      - name: Assert a real Palace process was launched and hashes verify
        if: ${{ github.event_name == 'schedule' || inputs.run_benchmark }}
        run: |
          uv run python - <<'EOF'
          import json, pathlib, sys
          manifest = json.loads(
              pathlib.Path("out/palace_resonator_v017/run_manifest.json").read_text()
          )
          invocations = manifest.get("invocations", [])
          launched = [
              inv for inv in invocations
              if inv.get("return_code") == 0 and inv.get("command")
          ]
          if not launched:
              print("no real Palace invocation recorded in run_manifest.json")
              sys.exit(1)
          print(f"{len(launched)} real Palace invocation(s) recorded")
          EOF
          # promote verifies every retained output hash and requires a
          # solver-backed status; it never promotes a non-executed run.
          uv run python scripts/promote_palace_v017.py --run out/palace_resonator_v017

      - name: Publish and drift-check the compact benchmark packet
        if: ${{ github.event_name == 'schedule' || inputs.run_benchmark }}
        run: |
          uv run python scripts/publish_palace_v017_benchmark.py \
            --run out/palace_resonator_v017
          uv run python scripts/publish_palace_v017_benchmark.py --check
          uv run python scripts/generate_readme_palace_benchmark.py --check

      - name: Collect compact artifacts (no binaries, no ParaView fields)
        if: always()
        run: |
          mkdir -p out/ci_artifacts
          find out/toolchain out/palace_bounded_diagnostic out/palace_resonator_v017 \
            \( -name '*.json' -o -name '*.csv' -o -name '*.md' -o -name '*.txt' \) \
            -size -2M ! -path '*/raw/*' -print0 2>/dev/null | \
            xargs -0 -I{} cp --parents {} out/ci_artifacts/ || true

      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: palace-integration-evidence
          path: out/ci_artifacts
          retention-days: 30

      - name: Upload adapted mesh (optional, expiring — never committed)
        if: ${{ github.event_name == 'schedule' || inputs.run_benchmark }}
        uses: actions/upload-artifact@v4
        with:
          name: palace-adapted-mesh
          path: out/palace_resonator_v017/raw
          retention-days: 7
          if-no-files-found: ignore
