name: quantum-metal-integration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quantum-metal-integration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mask:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Prepare shared core and external runtime
        run: |
          uv sync --frozen --dev
          uv venv .qm-env --python 3.12
          uv pip install --python .qm-env quantum-metal==0.9.0 gdstk==1.0.1
      - name: Execute two masks twice through the product command
        shell: bash
        env:
          QM_PYTHON: ${{ runner.os == 'Windows' && '.qm-env/Scripts/python.exe' || '.qm-env/bin/python' }}
        run: |
          uv run --no-sync textlayout quantum-metal-mask examples/integrations/quantum-metal-mask.json --python "$QM_PYTHON" --out out/qm-base-first
          uv run --no-sync textlayout quantum-metal-mask examples/integrations/quantum-metal-mask.json --python "$QM_PYTHON" --out out/qm-base-repeat
          uv run --no-sync textlayout quantum-metal-mask examples/integrations/quantum-metal-mask-small.json --python "$QM_PYTHON" --out out/qm-small-first
          uv run --no-sync textlayout quantum-metal-mask examples/integrations/quantum-metal-mask-small.json --python "$QM_PYTHON" --out out/qm-small-repeat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quantum-metal-mask-${{ matrix.os }}
          path: out/qm-*
          if-no-files-found: error
          retention-days: 30
